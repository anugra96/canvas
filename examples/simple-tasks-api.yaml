openapi: 3.1.0
info:
  title: Simple Tasks API
  version: 1.0.0
  description: A small task tracker API used to exercise the API profile.
servers:
  - url: https://api.example.test/v1
tags:
  - name: Tasks
    description: Create, inspect, update, and remove tasks.
  - name: Health
    description: Service liveness.
security:
  - BearerAuth: []
paths:
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of tasks to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: The task failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      parameters:
        - name: task_id
          in: path
          required: true
          description: Task identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: The task does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      parameters:
        - name: task_id
          in: path
          required: true
          description: Task identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: The task does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The update failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - name: task_id
          in: path
          required: true
          description: Task identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The task was deleted.
        '404':
          description: The task does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /healthz:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Check service health
      security: []
      responses:
        '200':
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Send a bearer token in the Authorization header.
  schemas:
    Task:
      type: object
      additionalProperties: false
      required: [id, title, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [open, in_progress, done]
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        dueDate:
          type: string
          format: date
    TaskUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [open, in_progress, done]
        dueDate:
          type: string
          format: date
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type: string
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
