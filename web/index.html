<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <script>
      try {
        const theme = localStorage.getItem('canvas-theme');
        if (['graphite', 'paper', 'dune', 'abyss', 'ember'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <title>Canvas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
